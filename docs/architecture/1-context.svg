<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="1-context-title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" style="color: var(--arch-fg, #24292f)">
<title id="1-context-title">Context view: who uses gmd, and what it talks to</title>
<defs><marker id="1-context-arrow-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="1-context-arrow-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--arch-main, #0969da)"/></marker><marker id="1-context-arrow-side" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--arch-side, #b07800)"/></marker></defs>
<rect width="960" height="560" fill="var(--arch-bg, #ffffff)"/>
<rect x="170" y="40" width="540" height="470" rx="10" fill="var(--arch-group, #f3f5f8)" stroke="currentColor" stroke-opacity="0.45"/>
<text x="182" y="60" font-size="12.5" fill="currentColor" font-weight="600" fill-opacity="0.8">The developer's machine (or a server over ssh, or a container)</text>
<rect x="740" y="40" width="200" height="470" rx="10" fill="var(--arch-group, #f3f5f8)" stroke="currentColor" stroke-opacity="0.45" stroke-dasharray="6 4"/>
<text x="752" y="60" font-size="12.5" fill="currentColor" font-weight="600" fill-opacity="0.8">Outside</text>
<path d="M115,201.4 L200,201.4" fill="none" stroke="var(--arch-main, #0969da)" stroke-width="1.6" marker-end="url(#1-context-arrow-main)"/>
<path d="M200,253 L115,253" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#1-context-arrow-plain)"/>
<path d="M390,215.2 L500,215.2" fill="none" stroke="var(--arch-main, #0969da)" stroke-width="1.6" marker-end="url(#1-context-arrow-main)"/>
<path d="M500,253 L390,253" fill="none" stroke="var(--arch-side, #b07800)" stroke-width="1.6" marker-end="url(#1-context-arrow-side)"/>
<path d="M590,274 L590,350" fill="none" stroke="var(--arch-main, #0969da)" stroke-width="1.6" marker-end="url(#1-context-arrow-main)"/>
<path d="M680,232 L760,232" fill="none" stroke="var(--arch-main, #0969da)" stroke-width="1.6" marker-end="url(#1-context-arrow-main)"/>
<path d="M276,274 L276,350" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#1-context-arrow-plain)"/>
<path d="M266.5,190 L266.5,148" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#1-context-arrow-plain)"/>
<path d="M361.5,190 L361.5,165 L530,165 L530,148" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#1-context-arrow-plain)"/>
<path d="M376.7,274 L376.7,478 L840,478 L840,418" fill="none" stroke="var(--arch-side, #b07800)" stroke-width="1.6" marker-end="url(#1-context-arrow-side)"/>
<circle cx="60.0" cy="189" r="12" fill="var(--arch-card, #ffffff)" stroke="currentColor" stroke-width="1.3"/>
<path d="M36.0,227 q0,-24 24,-24 q24,0 24,24 z" fill="var(--arch-card, #ffffff)" stroke="currentColor" stroke-width="1.3"/>
<text x="60" y="245" font-size="14" fill="currentColor" font-weight="600" text-anchor="middle">Developer</text>
<text x="60" y="263" font-size="12.5" fill="currentColor" text-anchor="middle" fill-opacity="0.8">in a terminal</text>
<rect x="195" y="80" width="215" height="68" rx="6" fill="var(--arch-card, #ffffff)" stroke="currentColor" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="205" y="100" font-size="14" fill="currentColor" font-weight="600">Clipboard tool</text>
<text x="205" y="119" font-size="12.5" fill="currentColor" fill-opacity="0.8">pbcopy, wl-copy, xclip, clip.exe;</text>
<text x="205" y="135" font-size="12.5" fill="currentColor" fill-opacity="0.8">else the terminal (OSC 52)</text>
<rect x="490" y="80" width="200" height="68" rx="6" fill="var(--arch-card, #ffffff)" stroke="currentColor" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="500" y="100" font-size="14" fill="currentColor" font-weight="600">Browser</text>
<text x="500" y="119" font-size="12.5" fill="currentColor" fill-opacity="0.8">$BROWSER or the OS opener;</text>
<text x="500" y="135" font-size="12.5" fill="currentColor" fill-opacity="0.8">else the link is copied</text>
<rect x="200" y="190" width="190" height="84" rx="6" fill="var(--arch-card, #ffffff)" stroke="var(--arch-main, #0969da)" stroke-width="1.8"/>
<text x="210" y="210" font-size="14" fill="currentColor" font-weight="600">gmd</text>
<text x="210" y="229" font-size="12.5" fill="currentColor" fill-opacity="0.8">one executable, a full</text>
<text x="210" y="245" font-size="12.5" fill="currentColor" fill-opacity="0.8">screen terminal UI</text>
<rect x="500" y="190" width="180" height="84" rx="6" fill="var(--arch-card, #ffffff)" stroke="currentColor" stroke-width="1.1"/>
<text x="510" y="210" font-size="14" fill="currentColor" font-weight="600">git</text>
<text x="510" y="229" font-size="12.5" fill="currentColor" fill-opacity="0.8">a process per command,</text>
<text x="510" y="245" font-size="12.5" fill="currentColor" fill-opacity="0.8">and the ssh it runs</text>
<path d="M195,357 a87.5,7 0 0,0 175,0 a87.5,7 0 0,0 -175,0 v64 a87.5,7 0 0,0 175,0 v-64" fill="var(--arch-card, #ffffff)" stroke="currentColor" stroke-width="1.1"/>
<text x="205" y="380" font-size="14" fill="currentColor" font-weight="600">Home folder</text>
<text x="205" y="399" font-size="12.5" fill="currentColor" fill-opacity="0.8">~/.gmdconfig, ~/gmd.log,</text>
<text x="205" y="415" font-size="12.5" fill="currentColor" fill-opacity="0.8">the code coloring library</text>
<path d="M500,357 a97.5,7 0 0,0 195,0 a97.5,7 0 0,0 -195,0 v80 a97.5,7 0 0,0 195,0 v-80" fill="var(--arch-card, #ffffff)" stroke="currentColor" stroke-width="1.1"/>
<text x="510" y="380" font-size="14" fill="currentColor" font-weight="600">The repository</text>
<text x="510" y="399" font-size="12.5" fill="currentColor" fill-opacity="0.8">.git; gmd's .gmdconfig and</text>
<text x="510" y="415" font-size="12.5" fill="currentColor" fill-opacity="0.8">gmd-metadata.json; its refs</text>
<text x="510" y="431" font-size="12.5" fill="currentColor" fill-opacity="0.8">refs/gmd/, refs/gmdtags/</text>
<rect x="760" y="190" width="160" height="84" rx="6" fill="var(--arch-card, #ffffff)" stroke="currentColor" stroke-width="1.1"/>
<text x="770" y="210" font-size="14" fill="currentColor" font-weight="600">origin</text>
<text x="770" y="229" font-size="12.5" fill="currentColor" fill-opacity="0.8">the one remote gmd</text>
<text x="770" y="245" font-size="12.5" fill="currentColor" fill-opacity="0.8">works with: GitHub,</text>
<text x="770" y="261" font-size="12.5" fill="currentColor" fill-opacity="0.8">GitLab, any git host</text>
<rect x="760" y="350" width="160" height="68" rx="6" fill="var(--arch-card, #ffffff)" stroke="currentColor" stroke-width="1.1"/>
<text x="770" y="370" font-size="14" fill="currentColor" font-weight="600">GitHub releases</text>
<text x="770" y="389" font-size="12.5" fill="currentColor" fill-opacity="0.8">api.github.com, and</text>
<text x="770" y="405" font-size="12.5" fill="currentColor" fill-opacity="0.8">the release binaries</text>
<rect x="123.773" y="182.4" width="67.455" height="18" rx="3" fill="var(--arch-bg, #ffffff)" fill-opacity="0.92"/>
<text x="157.5" y="195.4" font-size="11.5" fill="currentColor" text-anchor="middle">keys, mouse</text>
<rect x="126.475" y="256" width="62.05" height="18" rx="3" fill="var(--arch-bg, #ffffff)" fill-opacity="0.92"/>
<text x="157.5" y="269" font-size="11.5" fill="currentColor" text-anchor="middle">the screen</text>
<rect x="419.38" y="196.2" width="51.24" height="18" rx="3" fill="var(--arch-bg, #ffffff)" fill-opacity="0.92"/>
<text x="445" y="209.2" font-size="11.5" fill="currentColor" text-anchor="middle">commands</text>
<rect x="422.082" y="256" width="45.835" height="18" rx="3" fill="var(--arch-bg, #ffffff)" fill-opacity="0.92"/>
<text x="445" y="269" font-size="11.5" fill="currentColor" text-anchor="middle">askpass</text>
<rect x="550.867" y="303" width="78.265" height="18" rx="3" fill="var(--arch-bg, #ffffff)" fill-opacity="0.92"/>
<text x="590" y="316" font-size="11.5" fill="currentColor" text-anchor="middle">reads, writes</text>
<rect x="683.57" y="215.5" width="72.86" height="33" rx="3" fill="var(--arch-bg, #ffffff)" fill-opacity="0.92"/>
<text x="720" y="228.5" font-size="11.5" fill="currentColor" text-anchor="middle">fetch, push,</text>
<text x="720" y="243.5" font-size="11.5" fill="currentColor" text-anchor="middle">pull</text>
<rect x="236.868" y="303" width="78.265" height="18" rx="3" fill="var(--arch-bg, #ffffff)" fill-opacity="0.92"/>
<text x="276" y="316" font-size="11.5" fill="currentColor" text-anchor="middle">settings, log</text>
<rect x="251.69" y="160" width="29.62" height="18" rx="3" fill="var(--arch-bg, #ffffff)" fill-opacity="0.92"/>
<text x="266.5" y="173" font-size="11.5" fill="currentColor" text-anchor="middle">copy</text>
<rect x="412.022" y="156" width="67.455" height="18" rx="3" fill="var(--arch-bg, #ffffff)" fill-opacity="0.92"/>
<text x="445.75" y="169" font-size="11.5" fill="currentColor" text-anchor="middle">open a page</text>
<rect x="551.95" y="469" width="116.1" height="18" rx="3" fill="var(--arch-bg, #ffffff)" fill-opacity="0.92"/>
<text x="610" y="482" font-size="11.5" fill="currentColor" text-anchor="middle">update check, hourly</text>
<line x1="190" y1="538" x2="224" y2="538" stroke="var(--arch-main, #0969da)" stroke-width="2"/>
<text x="232" y="542" font-size="11.5" fill="currentColor" fill-opacity="0.8">the main path</text>
<line x1="331.9" y1="538" x2="365.9" y2="538" stroke="var(--arch-side, #b07800)" stroke-width="2"/>
<text x="373.9" y="542" font-size="11.5" fill="currentColor" fill-opacity="0.8">background work, events, optional</text>
<line x1="599.8" y1="538" x2="633.8" y2="538" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/>
<text x="641.8" y="542" font-size="11.5" fill="currentColor" fill-opacity="0.8">optional, or outside gmd</text>
</svg>
