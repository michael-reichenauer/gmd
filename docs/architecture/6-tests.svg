<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="6-tests-title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" style="color: var(--arch-fg, #24292f)">
<title id="6-tests-title">Test view: from a fake git to the real binary in a terminal</title>
<defs><marker id="6-tests-arrow-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="6-tests-arrow-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--arch-main, #0969da)"/></marker><marker id="6-tests-arrow-side" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--arch-side, #b07800)"/></marker></defs>
<rect width="960" height="470" fill="var(--arch-bg, #ffffff)"/>
<rect x="20" y="40" width="230" height="210" rx="10" fill="var(--arch-group, #f3f5f8)" stroke="currentColor" stroke-opacity="0.45"/>
<text x="32" y="60" font-size="12.5" fill="currentColor" font-weight="600" fill-opacity="0.8">gmdE2eTest: about 300 tests</text>
<rect x="280" y="40" width="660" height="210" rx="10" fill="var(--arch-group, #f3f5f8)" stroke="currentColor" stroke-opacity="0.45"/>
<text x="292" y="60" font-size="12.5" fill="currentColor" font-weight="600" fill-opacity="0.8">gmdTest: about 2.1k tests, run one at a time</text>
<rect x="20" y="290" width="920" height="130" rx="10" fill="var(--arch-group, #f3f5f8)" stroke="currentColor" stroke-opacity="0.45"/>
<text x="32" y="310" font-size="12.5" fill="currentColor" font-weight="600" fill-opacity="0.8">gmd</text>
<path d="M135,180 L135,330" fill="none" stroke="var(--arch-side, #b07800)" stroke-width="1.6" marker-end="url(#6-tests-arrow-side)"/>
<path d="M400,164 L400,330" fill="none" stroke="var(--arch-main, #0969da)" stroke-width="1.6" marker-end="url(#6-tests-arrow-main)"/>
