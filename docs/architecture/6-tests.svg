<path d="M230,356 L300,356" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#6-tests-arrow-plain)"/>
<path d="M500,356 L520,356" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#6-tests-arrow-plain)"/>
<path d="M710,356 L730,356" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#6-tests-arrow-plain)"/>
<path d="M820,356 L840,356" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#6-tests-arrow-plain)"/>
<rect x="40" y="80" width="190" height="100" rx="6" fill="var(--arch-card, #ffffff)" stroke="currentColor" stroke-width="1.1"/>
<text x="50" y="100" font-size="14" fill="currentColor" font-weight="600">TmuxSession</text>
<text x="50" y="119" font-size="12.5" fill="currentColor" fill-opacity="0.8">the built binary in tmux,</text>
<text x="50" y="135" font-size="12.5" fill="currentColor" fill-opacity="0.8">8 tests at a time; the</text>
<text x="50" y="151" font-size="12.5" fill="currentColor" fill-opacity="0.8">screen captured as text</text>
<text x="50" y="167" font-size="12.5" fill="currentColor" fill-opacity="0.8">and as colors</text>
<rect x="300" y="80" width="200" height="84" rx="6" fill="var(--arch-card, #ffffff)" stroke="currentColor" stroke-width="1.1"/>
<text x="310" y="100" font-size="14" fill="currentColor" font-weight="600">RepoBuilder, GraphText</text>
<text x="310" y="119" font-size="12.5" fill="currentColor" fill-opacity="0.8">a GitRepo by hand, the</text>
<text x="310" y="135" font-size="12.5" fill="currentColor" fill-opacity="0.8">real inference, the graph</text>
<text x="310" y="151" font-size="12.5" fill="currentColor" fill-opacity="0.8">as a text picture</text>
<rect x="520" y="80" width="190" height="84" rx="6" fill="var(--arch-card, #ffffff)" stroke="currentColor" stroke-width="1.1"/>
<text x="530" y="100" font-size="14" fill="currentColor" font-weight="600">FakeCmd</text>
<text x="530" y="119" font-size="12.5" fill="currentColor" fill-opacity="0.8">canned git output for</text>
<text x="530" y="135" font-size="12.5" fill="currentColor" fill-opacity="0.8">the Git services, which</text>
<text x="530" y="151" font-size="12.5" fill="currentColor" fill-opacity="0.8">parse it; no process</text>
<rect x="730" y="80" width="190" height="84" rx="6" fill="var(--arch-card, #ffffff)" stroke="currentColor" stroke-width="1.1"/>
<text x="740" y="100" font-size="14" fill="currentColor" font-weight="600">TempRepo</text>
<text x="740" y="119" font-size="12.5" fill="currentColor" fill-opacity="0.8">real git, a temp folder;</text>
<text x="740" y="135" font-size="12.5" fill="currentColor" fill-opacity="0.8">about 220 Integration</text>
<text x="740" y="151" font-size="12.5" fill="currentColor" fill-opacity="0.8">tests, real repos too</text>
<rect x="40" y="330" width="190" height="52" rx="6" fill="var(--arch-card, #ffffff)" stroke="currentColor" stroke-width="1.1"/>
<text x="50" y="350" font-size="14" fill="currentColor" font-weight="600">Cui</text>
<text x="50" y="369" font-size="12.5" fill="currentColor" fill-opacity="0.8">views, graph, keys</text>
<rect x="300" y="330" width="200" height="52" rx="6" fill="var(--arch-card, #ffffff)" stroke="currentColor" stroke-width="1.1"/>
<text x="310" y="350" font-size="14" fill="currentColor" font-weight="600">Server, Augmented</text>
<text x="310" y="369" font-size="12.5" fill="currentColor" fill-opacity="0.8">the inference</text>
<rect x="520" y="330" width="190" height="52" rx="6" fill="var(--arch-card, #ffffff)" stroke="currentColor" stroke-width="1.1"/>
<text x="530" y="350" font-size="14" fill="currentColor" font-weight="600">Git</text>
<text x="530" y="369" font-size="12.5" fill="currentColor" fill-opacity="0.8">services, parsers</text>
<rect x="730" y="330" width="90" height="52" rx="6" fill="var(--arch-card, #ffffff)" stroke="currentColor" stroke-width="1.1"/>
<text x="740" y="350" font-size="14" fill="currentColor" font-weight="600">Cmd</text>
<text x="740" y="369" font-size="12.5" fill="currentColor" fill-opacity="0.8">processes</text>
<rect x="840" y="330" width="80" height="52" rx="6" fill="var(--arch-card, #ffffff)" stroke="currentColor" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="850" y="350" font-size="14" fill="currentColor" font-weight="600">git</text>
<text x="850" y="369" font-size="12.5" fill="currentColor" fill-opacity="0.8">the CLI</text>
<rect x="79.6525" y="246" width="110.695" height="18" rx="3" fill="var(--arch-bg, #ffffff)" fill-opacity="0.92"/>
<text x="135" y="259" font-size="11.5" fill="currentColor" text-anchor="middle">keys in, screen out</text>
<text x="40" y="446" font-size="11.5" fill="currentColor" fill-opacity="0.75" font-style="italic">Every push runs both projects in CI (build.yml); the end-to-end tier is about five minutes on four cores.</text>
<line x1="40" y1="462" x2="74" y2="462" stroke="var(--arch-main, #0969da)" stroke-width="2"/>
<text x="82" y="466" font-size="11.5" fill="currentColor" fill-opacity="0.8">the main path</text>
<line x1="181.89999999999998" y1="462" x2="215.89999999999998" y2="462" stroke="var(--arch-side, #b07800)" stroke-width="2"/>
<text x="223.9" y="466" font-size="11.5" fill="currentColor" fill-opacity="0.8">background work, events, optional</text>
</svg>
