<path d="M61.0,352 q0,-24 24,-24 q24,0 24,24 z" fill="var(--arch-card, #ffffff)" stroke="currentColor" stroke-width="1.3"/>
<text x="85" y="370" font-size="14" fill="currentColor" font-weight="600" text-anchor="middle">Developer</text>
<text x="85" y="388" font-size="12.5" fill="currentColor" text-anchor="middle" fill-opacity="0.8">presses keys,</text>
<text x="85" y="404" font-size="12.5" fill="currentColor" text-anchor="middle" fill-opacity="0.8">reads the log</text>
<rect x="190" y="80" width="250" height="52" rx="6" fill="var(--arch-card, #ffffff)" stroke="var(--arch-main, #0969da)" stroke-width="1.8"/>
<text x="200" y="100" font-size="14" fill="currentColor" font-weight="600">RepoViewInput</text>
<text x="200" y="119" font-size="12.5" fill="currentColor" fill-opacity="0.8">a key or a click, e.g. c, p, m</text>
<rect x="190" y="190" width="250" height="68" rx="6" fill="var(--arch-card, #ffffff)" stroke="var(--arch-main, #0969da)" stroke-width="1.8"/>
<text x="200" y="210" font-size="14" fill="currentColor" font-weight="600">*Commands, CommandRunner</text>
<text x="200" y="229" font-size="12.5" fill="currentColor" fill-opacity="0.8">the command, with progress</text>
<text x="200" y="245" font-size="12.5" fill="currentColor" fill-opacity="0.8">shown and an error box</text>
<rect x="190" y="320" width="250" height="68" rx="6" fill="var(--arch-card, #ffffff)" stroke="var(--arch-main, #0969da)" stroke-width="1.8"/>
<text x="200" y="340" font-size="14" fill="currentColor" font-weight="600">RepoView refresh</text>
<text x="200" y="359" font-size="12.5" fill="currentColor" fill-opacity="0.8">ShowRefreshedRepoAsync, with</text>
<text x="200" y="375" font-size="12.5" fill="currentColor" fill-opacity="0.8">the shown branches' names</text>
<rect x="190" y="450" width="250" height="68" rx="6" fill="var(--arch-card, #ffffff)" stroke="var(--arch-main, #0969da)" stroke-width="1.8"/>
<text x="200" y="470" font-size="14" fill="currentColor" font-weight="600">ContentView, RepoWriter</text>
<text x="200" y="489" font-size="12.5" fill="currentColor" fill-opacity="0.8">draws only the rows on</text>
<text x="200" y="505" font-size="12.5" fill="currentColor" fill-opacity="0.8">screen, on demand</text>
<rect x="190" y="570" width="250" height="68" rx="6" fill="var(--arch-card, #ffffff)" stroke="var(--arch-main, #0969da)" stroke-width="1.8"/>
<text x="200" y="590" font-size="14" fill="currentColor" font-weight="600">RepoSnapshot, GraphCreator</text>
<text x="200" y="609" font-size="12.5" fill="currentColor" fill-opacity="0.8">a snapshot of the shown</text>
<text x="200" y="625" font-size="12.5" fill="currentColor" fill-opacity="0.8">repo, and its graph</text>
<rect x="510" y="80" width="250" height="68" rx="6" fill="var(--arch-card, #ffffff)" stroke="var(--arch-main, #0969da)" stroke-width="1.8"/>
<text x="520" y="100" font-size="14" fill="currentColor" font-weight="600">Server, in Paused</text>
<text x="520" y="119" font-size="12.5" fill="currentColor" fill-opacity="0.8">the write, with the file</text>
<text x="520" y="135" font-size="12.5" fill="currentColor" fill-opacity="0.8">monitor paused meanwhile</text>
<rect x="510" y="190" width="250" height="68" rx="6" fill="var(--arch-card, #ffffff)" stroke="var(--arch-side, #b07800)" stroke-width="1.8"/>
<text x="520" y="210" font-size="14" fill="currentColor" font-weight="600">FileMonitor</text>
<text x="520" y="229" font-size="12.5" fill="currentColor" fill-opacity="0.8">watches the working folder</text>
<text x="520" y="245" font-size="12.5" fill="currentColor" fill-opacity="0.8">and .git, debounced 1 s</text>
<rect x="510" y="320" width="250" height="68" rx="6" fill="var(--arch-card, #ffffff)" stroke="var(--arch-main, #0969da)" stroke-width="1.8"/>
<text x="520" y="340" font-size="14" fill="currentColor" font-weight="600">AugmentedService</text>
<text x="520" y="359" font-size="12.5" fill="currentColor" fill-opacity="0.8">the git reads, in parallel,</text>
<text x="520" y="375" font-size="12.5" fill="currentColor" fill-opacity="0.8">into a GitRepo</text>
<rect x="510" y="450" width="250" height="68" rx="6" fill="var(--arch-card, #ffffff)" stroke="var(--arch-main, #0969da)" stroke-width="1.8"/>
<text x="520" y="470" font-size="14" fill="currentColor" font-weight="600">Augmenter, in Task.Run</text>
<text x="520" y="489" font-size="12.5" fill="currentColor" fill-opacity="0.8">infers each commit's branch</text>
<text x="520" y="505" font-size="12.5" fill="currentColor" fill-opacity="0.8">into an immutable Repo</text>
<rect x="510" y="570" width="250" height="68" rx="6" fill="var(--arch-card, #ffffff)" stroke="var(--arch-main, #0969da)" stroke-width="1.8"/>
<text x="520" y="590" font-size="14" fill="currentColor" font-weight="600">ViewRepoCreator</text>
<text x="520" y="609" font-size="12.5" fill="currentColor" fill-opacity="0.8">the commits of the</text>
<text x="520" y="625" font-size="12.5" fill="currentColor" fill-opacity="0.8">branches shown</text>
<rect x="840" y="80" width="230" height="68" rx="6" fill="var(--arch-card, #ffffff)" stroke="var(--arch-main, #0969da)" stroke-width="1.8"/>
<text x="850" y="100" font-size="14" fill="currentColor" font-weight="600">git commit, push, ...</text>
<text x="850" y="119" font-size="12.5" fill="currentColor" fill-opacity="0.8">the write, through IGit,</text>
<text x="850" y="135" font-size="12.5" fill="currentColor" fill-opacity="0.8">the Git services and Cmd</text>
<rect x="840" y="190" width="230" height="68" rx="6" fill="var(--arch-card, #ffffff)" stroke="currentColor" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="850" y="210" font-size="14" fill="currentColor" font-weight="600">Editor, another git</text>
<text x="850" y="229" font-size="12.5" fill="currentColor" fill-opacity="0.8">anything that changes</text>
<text x="850" y="245" font-size="12.5" fill="currentColor" fill-opacity="0.8">the files or the refs</text>
<rect x="840" y="320" width="230" height="68" rx="6" fill="var(--arch-card, #ffffff)" stroke="var(--arch-main, #0969da)" stroke-width="1.8"/>
<text x="850" y="340" font-size="14" fill="currentColor" font-weight="600">git log, status, ...</text>
<text x="850" y="359" font-size="12.5" fill="currentColor" fill-opacity="0.8">log, branches, tags, status,</text>
<text x="850" y="375" font-size="12.5" fill="currentColor" fill-opacity="0.8">stashes, worktrees, reflog</text>
