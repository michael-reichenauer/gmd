# Weekly pull requests into dev for the NuGet packages, the dotnet tools and the GitHub Actions, the
# minor and patch updates of each grouped into one, so CSharpier's tool and MSBuild package move
# together. Terminal.Gui 2 replaces most of the API gmd uses, so that move is a port of its own
# rather than a pull request (docs/MODERNIZATION.md).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      nuget:
        update-types: [minor, patch]
    ignore:
      - dependency-name: Terminal.Gui
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
